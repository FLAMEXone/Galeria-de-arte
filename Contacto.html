<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contacto Empresa</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
			integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
			crossorigin="anonymous"></script>
</head>

<body>
	<h1>Galeria de arte <i>A Trav&eacute;s de Mis Ojos</i></h1>
	<div class="container">
		<section class="row">
			<h2><u>CONTACTO</u></h1>
				<nav>
					<a href="Inicio.html">Inicio</a>
					<a href="Galeria.html">Galeria</a>
					<a href="Contacto.html">Contacto</a>
				</nav>
		</section>
	</div>

	<section>
		<form action="#" method="post">
			<h2><u>CONTACTANOS:</u></h2>

			<div>
				<h3>Nombre:</h3>
				<input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required /><br>

				<h3>Email:</h3>
				<input type="email" placeholder="ejemplo@gmail.com" id="correo" name="correo" required><br>

				<h3>Tipo De Solicitud:</h3>
				<select id="tipo" name="tipo" required>
					<option value="">Seleccione una opción</option>
					<option value="Compra">Compra</option>
					<option value="Consulta">Consulta</option>
					<option value="Venta">Venta</option>
				</select><br>
			</div>

			<div>
				<h3>Mensaje:</h3>
				<textarea placeholder="Escriba aquí su mensaje" id="mensaje" name="mensaje" rows="5" cols="30"
					required></textarea><br>
				<input type="submit" value="Enviar" />
			</div>
		</form>
	</section>

	<footer>
		<ul><u>Información de contacto:</u></ul>
		<li>Dirección: DR.Torres Boonen 829, Providencia, Santiago de Chile</li>
		<li>Teléfono: +56974925394</li>
	</footer>
	</div>
</body>

</html>
